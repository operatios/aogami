[project]
name = "aogami"
version = "0.1.0"
description = "Strongly-typed Telegram Bot API framework"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "operatios" }]
dependencies = [
  "httpx2[socks]>=2.10.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["ANN", "PYI"]
preview = true

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
